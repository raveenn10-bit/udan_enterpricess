     ========================================================================== -->

        <stop offset="100%" stop-color="#140205" />
      </linearGradient>

      <!-- Blood-Red Sun/Moon Radial Glow -->

        <stop offset="0%" stop-color="#ff2632" stop-opacity="0.85" />
        <stop offset="35%" stop-color="#d90b1c" stop-opacity="0.55" />
        <stop offset="65%" stop-color="#7a050f" stop-opacity="0.25" />
        <stop offset="100%" stop-color="#1f0206" stop-opacity="0" />
      </radialGradient>

      <!-- Giant Crimson Sun/Moon Disc -->
      <linearGradient id="moonDiscGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ff5240" />
        <stop offset="45%" stop-color="#ff1a26" />
        <stop offset="100%" stop-color="#8a0712" />
      </linearGradient>

      <!-- Headlight Projector Beam Gradient -->
      <linearGradient id="headlightBeamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
        <stop offset="22%" stop-color="#fff2c2" stop-opacity="0.75" />
        <stop offset="55%" stop-color="#ffb74d" stop-opacity="0.32" />
        <stop offset="85%" stop-color="#ff7043" stop-opacity="0.1" />
        <stop offset="100%" stop-color="#ff5722" stop-opacity="0" />
      </linearGradient>

      <!-- Headlight Road Asphalt Puddle Reflection -->
      <radialGradient id="roadLightPuddle" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe082" stop-opacity="0.55" />
        <stop offset="40%" stop-color="#ff8f00" stop-opacity="0.25" />
        <stop offset="100%" stop-color="#d84315" stop-opacity="0" />
      </radialGradient>

      <!-- Tail Light Speed Streaks Gradient -->
      <linearGradient id="speedStreakGrad" x1="100%" y1="50%" x2="0%" y2="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
        <stop offset="15%" stop-color="#ff2e3b" stop-opacity="0.9" />
        <stop offset="50%" stop-color="#e60012" stop-opacity="0.5" />
        <stop offset="85%" stop-color="#800008" stop-opacity="0.15" />
        <stop offset="100%" stop-color="#ff0015" stop-opacity="0" />
      </linearGradient>

      <!-- Streetlight Ambient Cone Gradient -->
      <linearGradient id="lampConeGrad" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#ffe57f" stop-opacity="0.7" />
        <stop offset="40%" stop-color="#ffb74d" stop-opacity="0.35" />
        <stop offset="80%" stop-color="#ff9100" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#ff6d00" stop-opacity="0" />
      </linearGradient>

      <!-- Lotus Tower Petal Illumination -->

        <stop offset="0%" stop-color="#ff2a4b" />
        <stop offset="50%" stop-color="#cc0828" />
        <stop offset="100%" stop-color="#54000d" />
      </linearGradient>

      <!-- Neon Edge Filters -->
      <filter id="neonBloom" x="-20%" y="-40%" width="140%" height="180%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="blurWide" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blurSharp" />
        <feMerge>
          <feMergeNode in="blurWide" />
          <feMergeNode in="blurSharp" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Headlight Glow Filter -->
      <filter id="bulbGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Reusable Chevron Road Warning Sign Symbol -->

        <!-- Downward Golden Light Cone -->
        <polygon points="21,-65 35,0 9,0" fill="url(#lampConeGrad)" />
      </g>

    <style>
      /* Wheels rotation */
      .wheel-spin {
        animation: udanWheelRoll 0.45s linear infinite;
        transform-box: fill-box;
        transform-origin: center center;
      }
      @keyframes udanWheelRoll {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Micro-suspension road bounce */
      .bike-chassis-bounce {
        animation: udanSuspension 0.28s ease-in-out infinite alternate;
      }
      @keyframes udanSuspension {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-0.85px); }
      }

      /* Headlight subtle beam flicker */
      .beam-shimmer {
        animation: udanBeamPulse 2.8s ease-in-out infinite alternate;
      }
      @keyframes udanBeamPulse {
        0% { opacity: 0.82; transform: scaleY(0.97); }
        100% { opacity: 0.98; transform: scaleY(1.02); }
      }

      /* Lotus Tower aviation beacon blink */
      .lotus-beacon {
        animation: udanBeaconBlink 1.2s ease-in-out infinite alternate;
      }
      @keyframes udanBeaconBlink {
        0% { opacity: 0.2; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.4); }
      }

      /* Ambient floating embers / sparks */
      .sky-ember {
        animation: udanEmberFloat 4.5s ease-in-out infinite;
      }
      .ember-1 { animation-delay: 0s; }
      .ember-2 { animation-delay: 1.1s; }
      .ember-3 { animation-delay: 2.2s; }
      .ember-4 { animation-delay: 3.3s; }
      .ember-5 { animation-delay: 1.7s; }
      @keyframes udanEmberFloat {
        0% { transform: translateY(0) translateX(0); opacity: 0; }
        25% { opacity: 0.85; }
        75% { opacity: 0.6; }
        100% { transform: translateY(-42px) translateX(18px); opacity: 0; }
      }

      /* Speed trails pulse */
      .speed-trail {
        animation: udanTrailStretch 0.6s ease-in-out infinite alternate;
      }
      @keyframes udanTrailStretch {
        0% { opacity: 0.75; transform: scaleX(0.92); }
        100% { opacity: 1; transform: scaleX(1.08); }
      }

      /* Neon road subtle breath */
      .neon-glow-line {
        animation: udanNeonPulse 3s ease-in-out infinite alternate;
      }
      @keyframes udanNeonPulse {
        0% { filter: drop-shadow(0 0 6px #ff1f24); }
        100% { filter: drop-shadow(0 0 14px #ff1f24) drop-shadow(0 0 4px #ff6666); }
      }

      /* Accessibility: Respect Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        .wheel-spin,
        .bike-chassis-bounce,
        .beam-shimmer,
        .lotus-beacon,
        .sky-ember,
        .speed-trail,
        .neon-glow-line {
          animation: none !important;
        }
        #travelingRiderGroup animateMotion {
          display: none !important;
        }
      }
    </style>
